name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run unit and conformance tests
        run: python -m unittest discover -s tests -v
      - name: Validate examples through the CLI
        run: |
          open-airs validate-inventory examples/ai-governance/inventory.json
          open-airs validate-inventory examples/contract-review/inventory.json
          for pack in packs/*/*/pack.json; do open-airs validate-pack "$pack"; done
