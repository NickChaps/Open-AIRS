[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-airs"
version = "0.1.0a9"
description = "Auditable AI registry, semantic qualification and versioned governance rules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicolas Chapuis" }]
keywords = ["ai governance", "ai registry", "rule engine", "EU AI Act", "GDPR", "NIS2", "NIST AI RMF"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NickChaps/Open-AIRS"
Documentation = "https://github.com/NickChaps/Open-AIRS/tree/main/docs"
Source = "https://github.com/NickChaps/Open-AIRS"
Issues = "https://github.com/NickChaps/Open-AIRS/issues"

[project.scripts]
open-airs = "open_airs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_airs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
include = [
  "src/open_airs/**/*.py",
  "src/open_airs/**/*.txt",
  "src/open_airs/py.typed",
]
